<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ranch des Quatre Vents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Plein écran : la scène 3D occupe tout, l'interface flotte par-dessus en cartons de bois sombre.
   Thème unique par choix : un jeu garde son monde, quel que soit le thème du système. */
:root{
  --ciel:#9fd8f5;
  --bois:#2f1f13;
  --carton:rgba(38,25,15,.86);
  --carton-fort:#33221a;
  --liseré:#7a5233;
  --texte:#fbf1dc;
  --texte-doux:#d6c19c;
  --or:#f3b52d;
  --rouge:#d9573f;
  --vert:#6cc24a;
  --bleu:#4aa3e0;
  --f-titre:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --f-texte:'Nunito',system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ciel);color:var(--texte);font-family:var(--f-texte);font-size:14px}
#jeu{position:fixed;inset:0}
#jeu canvas{display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--or);outline-offset:2px}
kbd{font-family:var(--f-texte);font-size:11px;font-weight:800;background:rgba(255,255,255,.14);border-radius:4px;padding:1px 5px;margin-left:4px}

.carton{background:var(--carton);border:2px solid var(--liseré);border-radius:12px;padding:10px 12px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
#hud{position:fixed;inset:0;pointer-events:none}
#hud > *{pointer-events:auto}
#gauche{position:absolute;left:16px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:10px;width:250px;max-width:calc(100vw - 32px - 130px)}
#carte-cheval .ligne{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#nom-cheval{font-family:var(--f-titre);font-weight:800;font-size:20px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#allure{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--or)}
.jauge{height:9px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden;margin:7px 0 6px}
.jauge i{display:block;height:100%;width:100%;background:var(--vert);border-radius:5px;transition:width .15s}
.jauge-lbl{font-size:11px;color:var(--texte-doux);display:flex;justify-content:space-between}
.ressources{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;margin-top:6px}
.ressources span{display:flex;align-items:center;gap:5px}
.pastille{width:11px;height:11px;border-radius:50%;display:inline-block}
.p-or{background:var(--or)}.p-pomme{background:#e0402f}.p-carotte{background:#f08a24}.p-fer{background:#ffd76a;border-radius:3px}
.ressources b{font-variant-numeric:tabular-nums}
#suivi-quete small{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--texte-doux)}
#quete-titre{font-family:var(--f-titre);font-size:17px;font-weight:800;display:block;line-height:1.2;margin-top:2px}
#quete-texte{margin:3px 0 6px;font-size:13px;line-height:1.35}
#quete-prog{font-size:12px;color:var(--texte-doux);display:flex;justify-content:space-between}
#suivi-quete.prete{border-color:var(--or)}
#suivi-quete.prete #quete-texte{color:var(--or);font-weight:800}

#minicarte{position:absolute;right:16px;top:calc(12px + env(safe-area-inset-top,0px));width:150px;height:150px;border-radius:12px;border:2px solid var(--liseré);box-shadow:0 4px 0 rgba(0,0,0,.25);background:#4e8d3a}
#menu{position:absolute;right:16px;top:calc(172px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;width:150px}
#menu button{background:var(--carton);border:2px solid var(--liseré);border-radius:10px;padding:7px 10px;font-weight:800;text-align:left;display:flex;justify-content:space-between;align-items:center}
#menu button:hover{border-color:var(--or)}
#horloge{padding:6px 10px;border-radius:10px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}

#chrono{position:absolute;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));font-family:var(--f-titre);font-weight:800;font-size:20px;text-align:center;white-space:nowrap}
#chrono small{display:block;font-family:var(--f-texte);font-size:12px;color:var(--texte-doux);font-weight:700}
#toasts{position:absolute;left:50%;transform:translateX(-50%);top:30%;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:min(90vw,460px)}
.toast{background:var(--carton);border:2px solid var(--liseré);border-radius:999px;padding:7px 16px;font-weight:800;text-align:center;transition:opacity .4s,transform .4s;animation:entre .25s ease-out}
.toast.or{border-color:var(--or);color:var(--or)}
.toast.rouge{border-color:var(--rouge)}
.toast.part{opacity:0;transform:translateY(-10px)}
@keyframes entre{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
#invite{cursor:pointer;position:absolute;left:50%;transform:translateX(-50%);bottom:calc(28px + env(safe-area-inset-bottom,0px));font-weight:800;font-size:15px;white-space:nowrap}
#invite kbd{font-size:13px;margin:0 6px 0 0;background:var(--or);color:var(--bois)}

#tactile{position:absolute;inset:auto 0 0 0;height:0}
#tactile .croix{position:absolute;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,54px);gap:6px}
#tactile .actions{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(2,70px);gap:8px}
#tactile button{background:var(--carton);border:2px solid var(--liseré);border-radius:14px;font-weight:800;font-size:15px;touch-action:none;user-select:none;-webkit-user-select:none;height:54px}
#tactile button.on{border-color:var(--or);color:var(--or)}
#tactile .haut{grid-column:2;grid-row:1}
#tactile .g{grid-column:1;grid-row:2}#tactile .b{grid-column:2;grid-row:2}#tactile .d{grid-column:3;grid-row:2}
#tactile .saut{grid-column:1 / span 2;height:64px;font-size:18px;background:#5a3a1f}

#voile{position:fixed;inset:0;background:rgba(20,12,6,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
#panneau{background:var(--carton-fort);border:3px solid var(--liseré);border-radius:16px;width:min(720px,100%);max-height:calc(100% - 8px);overflow:auto;padding:18px 18px 20px;position:relative;box-shadow:0 8px 0 rgba(0,0,0,.3)}
#fermer{position:absolute;right:12px;top:12px;background:transparent;border:2px solid var(--liseré);border-radius:8px;padding:3px 10px;font-weight:800;font-size:13px}
#panneau h2{font-family:var(--f-titre);font-weight:800;font-size:26px;margin:0 90px 4px 0;line-height:1.15;text-wrap:balance}
#panneau p{line-height:1.5;margin:6px 0;max-width:62ch}
.pnj{padding-right:100px;color:var(--texte-doux);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px;margin-top:14px}
.fiche{border:2px solid var(--liseré);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:rgba(255,255,255,.03);min-width:0}
.fiche.active{border-color:var(--or)}
.fiche-tete{display:flex;gap:10px;align-items:center}
.robe{width:36px;height:36px;border-radius:8px;flex:none;border:2px solid rgba(255,255,255,.25)}
.fiche input{width:100%;min-width:0;background:rgba(0,0,0,.25);border:1px solid var(--liseré);border-radius:6px;color:var(--texte);font:800 16px var(--f-titre);padding:2px 6px}
.fiche h3{font-family:var(--f-titre);font-size:18px;margin:0;line-height:1.1}
.fiche small{color:var(--texte-doux);font-size:12px}
.stat{display:grid;grid-template-columns:72px 1fr 34px;align-items:center;gap:6px;font-size:12px}
.stat .barre{height:7px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden}
.stat .barre i{display:block;height:100%;background:var(--bleu)}
.stat b{text-align:right;font-variant-numeric:tabular-nums}
.boutons{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.btn{background:#5a3a1f;border:2px solid var(--liseré);border-radius:9px;padding:6px 11px;font-weight:800;font-size:13px}
.btn:hover:not(:disabled){border-color:var(--or)}
.btn.or{background:var(--or);color:var(--bois);border-color:var(--or)}
.btn:disabled{opacity:.45;cursor:default}
.prix{font-family:var(--f-titre);font-weight:800;color:var(--or);font-size:17px}

.piste{position:relative;height:44px;border-radius:10px;background:rgba(255,255,255,.08);border:2px solid var(--liseré);margin:18px 0 10px;overflow:hidden}
.piste .zone{position:absolute;top:0;bottom:0;background:rgba(108,194,74,.45)}
.piste .parfait{position:absolute;top:0;bottom:0;background:rgba(243,181,45,.8)}
.piste .curseur{position:absolute;top:-2px;bottom:-2px;width:6px;margin-left:-3px;background:#fff;border-radius:3px;box-shadow:0 0 6px #000}
.resultats{display:flex;gap:6px;flex-wrap:wrap;min-height:28px}
.resultats span{border-radius:999px;padding:3px 10px;font-weight:800;font-size:12px;background:rgba(255,255,255,.1)}
.resultats .Parfait{background:var(--or);color:var(--bois)}.resultats .Bien{background:var(--vert);color:var(--bois)}
.gros{font-size:20px;padding:12px 22px;margin-top:8px}
.confiance{height:16px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:10px}
.confiance i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--vert),var(--or))}
.tenir{display:flex;gap:10px;justify-content:center;margin-top:10px}
.tenir button{width:90px;height:56px;font-size:22px;touch-action:none}
.aide-grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:4px 24px;margin-top:10px}
.aide-grille div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid rgba(255,255,255,.08);padding:5px 0}
.aide-grille kbd{font-size:12px}
.lieux{margin:10px 0 0;padding-left:18px;line-height:1.6}

#voile.lateral{background:transparent;justify-content:flex-end;align-items:stretch;pointer-events:none;padding:12px}
#voile.lateral #panneau{pointer-events:auto;width:min(420px,100%);max-height:none}
.onglets{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 6px}
.onglets button{background:transparent;border:2px solid var(--liseré);border-radius:999px;padding:5px 13px;font-weight:800}
.onglets button[aria-selected="true"]{background:var(--or);color:var(--bois);border-color:var(--or)}
#panneau h3.section{font-family:var(--f-titre);font-size:16px;margin:14px 0 4px}
.choix-ligne{display:flex;flex-wrap:wrap;gap:6px}
.choix{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.05);border:2px solid var(--liseré);border-radius:999px;padding:3px 10px 3px 4px;font-weight:700;font-size:13px}
.choix i{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.35);display:inline-block;flex:none}
.choix i.vide{background:repeating-linear-gradient(45deg,transparent 0 4px,rgba(255,255,255,.35) 4px 6px)}
.choix.choisi{border-color:var(--or);color:var(--or)}
.choix:hover{border-color:var(--or)}
.note{color:var(--texte-doux);font-size:12px;margin-top:14px!important}
#longe{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(540px,calc(100vw - 32px));display:flex;flex-direction:column;gap:7px}
.nuancier{display:flex;flex-wrap:wrap;gap:6px}.pastille{width:30px;height:30px;border-radius:50%;border:2px solid rgba(0,0,0,.35);padding:0;cursor:pointer}.pastille.on{outline:3px solid var(--or);outline-offset:2px}
#lecon{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(540px,calc(100vw - 32px));display:flex;flex-direction:column;gap:7px}
.lecon-tete{display:flex;justify-content:space-between;gap:10px;font-weight:800}
.lecon-tete span{color:var(--or)}
.lecon-jauges{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:6px 8px;align-items:center;font-size:12px}
.lecon-jauges .jauge{margin:0}
.lecon-jauges .jauge i{background:var(--bleu)}
.ordres{display:flex;gap:6px;flex-wrap:wrap}
.ordres button{flex:1;background:#5a3a1f;border:2px solid var(--liseré);border-radius:9px;padding:6px 4px;font-weight:800;font-size:13px;min-width:60px;touch-action:none}
.ordres button.on{background:var(--or);color:var(--bois);border-color:var(--or)}
#lecon small{color:var(--texte-doux)}
.reglage{display:grid;grid-template-columns:26px 1fr;gap:6px 8px;align-items:start;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.reglage > b{font-family:var(--f-titre);font-size:20px;color:var(--or);line-height:1.2}
.reglage .hauteur{grid-column:2;display:flex;align-items:center;gap:8px}
.reglage .hauteur span{min-width:56px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.choix.petit{font-size:12px;padding:3px 9px}
.conseil.rouge{color:#ff8a75}.conseil.vert{color:var(--vert)}.conseil.or{color:var(--or)}
.besoins{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:4px 6px;align-items:center;font-size:11px;color:var(--texte-doux);margin-top:4px}
.besoins .jauge{margin:0;height:6px}
@media (max-width:640px){
  #lecon,#longe{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
  #voile.lateral{align-items:flex-end;padding:8px}
  body.atelier #gauche,body.atelier #minicarte,body.atelier #menu,body.atelier #tactile{display:none}
  #voile.lateral #panneau{max-height:52%}
  #gauche{width:auto;max-width:calc(100vw - 32px - 104px);gap:8px}
  #minicarte{width:96px;height:96px}
  #menu{top:calc(116px + env(safe-area-inset-top,0px));width:96px}
  #menu kbd{display:none}
  #horloge{font-size:11px;padding:4px 4px}
  #nom-cheval{font-size:17px}
  #quete-texte{font-size:12px}
  .carton{padding:8px 10px}
  #invite{bottom:calc(150px + env(safe-area-inset-bottom,0px));font-size:13px}
  #chrono{top:auto;bottom:calc(196px + env(safe-area-inset-bottom,0px))}
}
/* téléphone tenu à l'horizontale : écran large mais peu haut. Cartes compactes, menu en une ligne en haut,
   pour que rien ne passe sous les boutons tactiles (constaté sur l'OPPO de Léa, 800 × 360 px CSS) */
@media (max-height:520px){
  #gauche{width:215px;gap:6px}
  .carton{padding:6px 9px;border-radius:10px}
  #nom-cheval{font-size:15px}
  #allure{font-size:10px}
  .jauge{margin:4px 0 3px;height:7px}
  .jauge-lbl,.besoins{font-size:10px}
  .ressources{font-size:11px;gap:8px;margin-top:3px}
  #quete-texte{display:none}
  #quete-titre{font-size:13px}
  #suivi-quete small{font-size:9px}
  #quete-prog{font-size:10px}
  #minicarte{width:84px;height:84px}
  #menu{top:calc(8px + env(safe-area-inset-top,0px));right:110px;width:auto;max-width:calc(100vw - 350px);flex-direction:row;flex-wrap:wrap;justify-content:flex-end;gap:5px}
  #menu button,#horloge{padding:4px 8px;font-size:12px;border-radius:8px}
  #menu kbd{display:none}
  #tactile .croix{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px);gap:5px;left:calc(12px + env(safe-area-inset-left,0px));bottom:12px}
  #tactile .actions{grid-template-columns:repeat(2,62px);gap:6px;right:calc(12px + env(safe-area-inset-right,0px));bottom:12px}
  #tactile button{height:46px;font-size:13px}
  #tactile .saut{height:52px;font-size:16px}
  #invite{bottom:12px;font-size:13px;max-width:calc(100vw - 420px);white-space:normal;text-align:center}
  #lecon,#longe{bottom:8px;width:min(400px,calc(100vw - 360px))}
  #chrono{font-size:16px}
  #voile #panneau{max-height:calc(100% - 4px);padding:12px}
}
@media (prefers-reduced-motion:reduce){.toast{animation:none;transition:none}}
</style>

<div id="jeu"></div>
<div id="hud">
  <div id="gauche">
    <section id="carte-cheval" class="carton" aria-label="Ton cheval">
      <div class="ligne"><span id="nom-cheval">Caramel</span><span id="allure">Arrêt</span></div>
      <div class="jauge"><i id="jauge-endu"></i></div>
      <div class="jauge-lbl"><span>Endurance</span><span id="niveaux"></span></div>
      <div class="besoins"><span>Faim</span><div class="jauge"><i id="j-faim"></i></div><span>Soif</span><div class="jauge"><i id="j-soif"></i></div></div>
      <div class="ressources">
        <span title="Pièces"><i class="pastille p-or"></i><b id="pieces">0</b></span>
        <span title="Pommes"><i class="pastille p-pomme"></i><b id="pommes">0</b></span>
        <span title="Carottes"><i class="pastille p-carotte"></i><b id="carottes">0</b></span>
        <span title="Fers dorés trouvés"><i class="pastille p-fer"></i><b id="fers">0</b></span>
      </div>
    </section>
    <section id="suivi-quete" class="carton" aria-label="Quête en cours">
      <small id="quete-num">Quête 1</small>
      <span id="quete-titre"></span>
      <p id="quete-texte"></p>
      <div id="quete-prog"><span id="quete-compte"></span><span id="quete-dist"></span></div>
    </section>
  </div>
  <canvas id="minicarte" width="300" height="300" aria-label="Carte"></canvas>
  <nav id="menu">
    <div id="horloge" class="carton" title="Jour et heure du ranch"></div>
    <button id="b-ecurie" type="button">Écurie <kbd>H</kbd></button>
    <button id="b-sellerie" type="button">Sellerie <kbd>G</kbd></button>
    <button id="b-pied" type="button">Descendre <kbd>M</kbd></button>
    <button id="b-amenager" type="button">Aménager <kbd>B</kbd></button>
    <button id="b-appel-cours" type="button">Cours <kbd>C</kbd></button>
    <button id="b-aide" type="button">Aide <kbd>?</kbd></button>
  </nav>
  <div id="chrono" class="carton" hidden></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="invite" class="carton" hidden></div>
  <div id="longe" class="carton" hidden>
    <div class="lecon-tete"><b id="lg-titre">Longe</b><span id="lg-temps"></span></div>
    <div class="ordres">
      <button type="button" data-longe="arret"><kbd>1</kbd>Arrêt</button><button type="button" data-longe="pas"><kbd>2</kbd>Pas</button>
      <button type="button" data-longe="trot"><kbd>3</kbd>Trot</button><button type="button" data-longe="galop"><kbd>4</kbd>Galop</button>
      <button type="button" data-longe="main"><kbd>5</kbd>Changer de main</button><button type="button" data-longe="fin"><kbd>E</kbd>Arrêter</button>
    </div>
  </div>
  <div id="lecon" class="carton" hidden>
    <div class="lecon-tete"><b id="l-titre">Leçon</b><span id="l-temps"></span></div>
    <div class="lecon-jauges"><span>Progrès</span><div class="jauge"><i id="l-prog"></i></div><span>Humeur</span><div class="jauge"><i id="l-humeur"></i></div></div>
    <div class="ordres">
      <button type="button" data-ordre="arret"><kbd>1</kbd>Arrêt</button><button type="button" data-ordre="pas"><kbd>2</kbd>Pas</button>
      <button type="button" data-ordre="trot"><kbd>3</kbd>Trot</button><button type="button" data-ordre="galop"><kbd>4</kbd>Galop</button>
      <button type="button" data-ordre="saut"><kbd>5</kbd>Saut</button>
    </div>

        <button class="btn" data-nourrir="carotte" data-id="${c.id}" ${etat.carottes ? '' : 'disabled'}>Carotte (${etat.carottes})</button>
        <button class="btn" data-nourrir="pomme" data-id="${c.id}" ${etat.pommes ? '' : 'disabled'}>Pomme (${etat.pommes})</button>
      </div></article>`;
  }).join('');
  ouvrir(`<div class="pnj">Ton écurie · ${etat.chevaux.length} ${etat.chevaux.length > 1 ? 'chevaux' : 'cheval'}</div><h2>Tes chevaux</h2>
    <p>Choisis le cheval que tu montes. Les autres sont au box, au pré ou en liberté là où tu les as laissés ; pense à leur faim et à leur soif. Une friandise renforce le lien, et un cheval qui a confiance refuse moins les obstacles.</p>
    <h3 class="section">Palefreniers · ${SALAIRE} pièces par jour chacun</h3>

    <div class="grille">${html}</div>`);
  $('#contenu').querySelectorAll('[data-embaucher]').forEach(b => b.onclick = () => { mesPalefreniers().push(b.dataset.embaucher); construirePalefreniers(); sauver(); toast(`${b.dataset.embaucher} est embauché${PALEFRENIERS.find(d => d.nom === b.dataset.embaucher).genre === 'f' ? 'e' : ''} : soins des chevaux de 7 h à 19 h`, 'or'); ecurie(); });
  $('#contenu').querySelectorAll('[data-renvoyer]').forEach(b => b.onclick = () => { const l = mesPalefreniers(); l.splice(l.indexOf(b.dataset.renvoyer), 1); construirePalefreniers(); sauver(); toast(`${b.dataset.renvoyer} est parti`); ecurie(); });
  $('#contenu').querySelectorAll('[data-monter]').forEach(b => b.onclick = () => { monter(b.dataset.monter); ecurie(); });
  $('#contenu').querySelectorAll('[data-lieu]').forEach(b => b.onclick = () => { const c = etat.chevaux.find(h => h.id === b.dataset.lieu);
    if (c.lieu !== 'box') { c.lieu = 'box'; if (mene?.cheval === c) mene = null; }
    else if (!etat.pres.length) { toast('Tu n’as aucun pré : construis-en un avec Aménager (B)', 'rouge'); return; }
    else { c.lieu = 'pre'; c.pre = etat.pres[0].id; c.pos = null; }
    majResidents(); sauver(); ecurie(); });
  $('#contenu').querySelectorAll('[data-revenir]').forEach(b => b.onclick = () => { const c = etat.chevaux.find(h => h.id === b.dataset.revenir);
    if (mene?.cheval === c) mene = null; c.fugue = null; c.pos = null;
    if (c.box != null) c.lieu = 'box'; else if (etat.pres.length) { c.lieu = 'pre'; c.pre = etat.pres[0].id; }
    else { c.lieu = 'libre'; c.pos = { x: J.x + 3, z: J.z + 3, rot: 0 }; }
    toast(`${c.nom} est revenu ${c.lieu === 'box' ? 'dans son box' : c.lieu === 'pre' ? 'au pré' : 'près de toi'}`);
    majResidents(); sauver(); ecurie(); });
  $('#contenu').querySelectorAll('[data-nurserie]').forEach(b => b.onclick = () => { const c = etat.chevaux.find(h => h.id === b.dataset.nurserie);
    if (c.lieu === 'pre' && c.pre === 'elevage') { c.lieu = c.box != null ? 'box' : 'pre'; c.pre = c.lieu === 'pre' ? 'p1' : c.pre; }
    else { c.lieu = 'pre'; c.pre = 'elevage'; c.pos = null; if (mene?.cheval === c) mene = null; toast(`${c.nom} va à la nurserie des poulains`); }
    majResidents(); sauver(); ecurie(); });
  $('#contenu').querySelectorAll('[data-repro]').forEach(b => b.onclick = () => { const c = etat.chevaux.find(h => h.id === b.dataset.repro);
    if (c.lieu === 'pre' && c.pre === 'repro') c.lieu = c.box != null ? 'box' : 'pre', c.pre = c.lieu === 'pre' ? 'p1' : c.pre;
    else { c.lieu = 'pre'; c.pre = 'repro'; c.pos = null; if (mene?.cheval === c) mene = null; toast(`${c.nom} (${sexeTexte(c)}) va au paddock de reproduction`); }
    majResidents(); sauver(); ecurie(); });
  $('#contenu').querySelectorAll('[data-perso]').forEach(b => b.onclick = () => { monter(b.dataset.perso); atelier('robe'); });
  $('#contenu').querySelectorAll('[data-nourrir]').forEach(b => b.onclick = () => { nourrir(b.dataset.nourrir, b.dataset.id); ecurie(); });
  $('#contenu').querySelectorAll('[data-nom]').forEach(inp => inp.onchange = () => {
    const c = etat.chevaux.find(h => h.id === inp.dataset.nom), v = inp.value.trim().slice(0, 16);
    if (c && v) { c.nom = v; majResidents(); sauver(); }
  });
}
function nourrir(quoi, id) {
  const c = etat.chevaux.find(h => h.id === (id || etat.actif));
  if (!c) return;
  if (quoi === 'carotte' && etat.carottes > 0) { etat.carottes--; gagnerXp(c, 'lien', 12); toast(`${c.nom} croque sa carotte`); }
  else if (quoi === 'pomme' && etat.pommes > 0) { etat.pommes--; gagnerXp(c, 'lien', 5); toast(`${c.nom} adore les pommes`); }
  else return;
  if (c.id === etat.actif) J.endu = Math.min(enduMax(), J.endu + 25);
  son(300, 0.1, 'triangle', 0.05); sauver();
}

function boutique() {

  const html = BOUTIQUE.map((b, i) => {
    const deja = races.has(b.race), peut = etat.pieces >= b.prix;
    return `<article class="fiche"><div class="fiche-tete"><span class="robe" style="background:${hex(ROBES[b.robe].corps)}"></span>
      <div><h3>${b.race}</h3><small>${fr(hauteurGarrot(b), 2)} m au garrot · ${ROBES[b.robe].nom}</small></div></div>
      <p style="margin:0;font-size:13px">${b.texte}</p>
      ${blocStats(Object.fromEntries(STATS.map(([k]) => [k, { niv: b.base[k], xp: 0 }])), false)}
      <div class="boutons" style="align-items:center;justify-content:space-between"><span class="prix">${b.prix} pièces</span>
      ${deja ? '<button class="btn" disabled>Déjà chez toi</button>' : `<button class="btn or" data-acheter="${i}" ${peut ? '' : 'disabled'}>Acheter</button>`}</div></article>`;
  }).join('');
  ouvrir(`<div class="pnj">Basile · marchand de chevaux</div><h2>Mes chevaux à vendre</h2>
    <p>Tu as <b>${etat.pieces} pièces</b>. Les quêtes de Margaux, les parcours et les fers dorés en rapportent. Les chiffres sont les niveaux de départ : le dressage les fera monter jusqu’à 10.</p>
    <div class="grille">${html}
    <article class="fiche"><div class="fiche-tete"><span class="robe" style="background:#f08a24"></span><div><h3>Sac de carottes</h3><small>5 carottes</small></div></div>
    <p style="margin:0">Une carotte donne plus de lien qu’une pomme. Touche F pour en donner une pendant la balade.</p>
    <div class="boutons" style="align-items:center;justify-content:space-between"><span class="prix">20 pièces</span><button class="btn or" data-carottes ${etat.pieces >= 20 ? '' : 'disabled'}>Acheter</button></div></article></div>
    <h3 class="section">Vendre un de tes chevaux</h3>
    <p>Basile te le rachète la moitié du prix de sa race, plus 15 pièces par niveau de ses caractéristiques. Il faut garder au moins un cheval, et descendre de celui qu’on vend.</p>
    <div class="grille">${etat.chevaux.map(c => `<article class="fiche"><div class="fiche-tete"><span class="robe" style="background:${hex((ROBES[c.robe] || ROBES.bai).corps)}"></span><div><h3>${c.nom}</h3><small>${c.race}</small></div></div>
      ${blocStats(c.stats, false)}<div class="boutons" style="align-items:center;justify-content:space-between"><span class="prix">${prixVente(c)} pièces</span><button class="btn" data-vendre-cheval="${c.id}" ${etat.chevaux.length < 2 ? 'disabled' : ''}>Vendre</button></div></article>`).join('')}</div>`);
  $('#contenu').querySelectorAll('[data-vendre-cheval]').forEach(b => b.onclick = () => vendreCheval(b.dataset.vendreCheval, b));
  $('#contenu').querySelectorAll('[data-acheter]').forEach(btn => btn.onclick = () => {
    const b = BOUTIQUE[+btn.dataset.acheter];
    if (etat.pieces < b.prix) return;
    etat.pieces -= b.prix;
    const c = nouveauCheval(nomLibre(), b.race, b.robe, b.base, b.taille); c.crin = b.crin ?? null;
    etat.chevaux.push(c); majResidents(); sonPiece();
    toast(`${c.nom} arrive au paddock !`, 'or'); sauver(); boutique();
  });
  const bc = $('#contenu [data-carottes]');
  if (bc) bc.onclick = () => { if (etat.pieces >= 20) { etat.pieces -= 20; etat.carottes += 5; sonPiece(); sauver(); boutique(); } };
}

// ---- Sellerie : robe, crins, modèle de selle, couleurs du harnachement et tenue de la cavalière
let vueAtelier = false, ongletAtelier = 'robe';
function choixCouleur(liste, actuel, cle, avecAucune = false, libelle = 'Aucune') {

}
function atelier(onglet = ongletAtelier) {

      return `<article class="fiche ${choisie ? 'active' : ''}"><h3>${s.nom}</h3><p style="margin:0">${s.texte}</p><div class="boutons">${bouton}</div></article>`;

      <h3 class="section">Bandes de travail</h3>${choixCouleur(TISSUS, e.cBandes, 'cBandes', true)}

  } else {

        <button class="choix ${genre === 'f' ? 'choisi' : ''}" data-genre="f">Cavalière</button></div>
      <h3 class="section">Peau</h3>${choixCouleur(PEAUX, t.peau, 'peau', true, 'D’origine')}
      <h3 class="section">Cheveux</h3>${choixCouleur(CHEVEUX, t.cheveux, 'cheveux', true, 'D’origine')}
      <h3 class="section">Haut</h3>${choixCouleur(TISSUS, t.veste, 'veste', true, 'D’origine')}

// ---- Box : soins
const SOINS = [['brosser', 'Brosser', 4, 'se laisse brosser, les yeux mi-clos'], ['pieds', 'Curer les pieds', 3, 'donne ses pieds sans broncher'], ['foin', 'Donner du foin', 3, 'mâchonne son foin'], ['eau', 'Changer l’eau', 2, 'boit de l’eau fraîche']];
const derniersSoins = {};
function soigner(c) {
  const t = maintenant();
  const boutons = SOINS.map(([k, l, xp]) => {
    const reste = Math.ceil(120 - (t - (derniersSoins[c.id + k] ?? -999)));
    return `<button class="btn ${reste > 0 ? '' : 'or'}" data-soin="${k}" ${reste > 0 ? 'disabled' : ''}>${l}${reste > 0 ? ` · encore ${reste} s` : ` · +${xp} lien`}</button>`;
  }).join('');
  ouvrir(`<div class="pnj">${c.box != null ? `Box ${c.box + 1}` : 'Ton cheval'} · ${c.race}</div><h2>Prendre soin de ${c.nom}</h2>
    <p>Les soins renforcent le lien : un cheval confiant refuse moins les obstacles et rassure les élèves débutants. Chaque soin peut se refaire au bout de deux minutes.</p>
    ${besoinsHtml(c)}${blocStats(c.stats)}<div class="boutons" style="margin-top:12px">${boutons}</div>
    <div class="boutons" style="margin-top:10px"><button class="btn" id="vers-pre">Le sortir au pré</button><button class="btn" id="le-monter">Le monter</button></div>`);
  $('#contenu').querySelectorAll('[data-soin]').forEach(b => b.onclick = () => {
    const [k, , xp, phrase] = SOINS.find(s => s[0] === b.dataset.soin);
    derniersSoins[c.id + k] = maintenant(); gagnerXp(c, 'lien', xp);
    if (k === 'foin') c.faim = Math.min(100, (c.faim ?? 80) + 40);
    if (k === 'eau') c.soif = Math.min(100, (c.soif ?? 80) + 50);
    toast(`${c.nom} ${phrase}`); son(380, 0.1, 'triangle', 0.05); sauver(); soigner(c);
  });
  $('#vers-pre').onclick = () => {
    if (!etat.pres.length) { toast('Tu n’as aucun pré : construis-en un avec Aménager (B)', 'rouge'); return; }
    c.lieu = 'pre'; c.pre = etat.pres[0].id; c.pos = null; majResidents(); sauver(); fermer(); toast(`${c.nom} part brouter au ${etat.pres[0].nom}`);
  };
  $('#le-monter').onclick = () => { monter(c.id); fermer(); };
}

// ---- Matériel de la carrière : disposition, type et hauteur de chaque obstacle
let vueCarriere = false;

  if (parcours.actif) { toast('Termine ou abandonne le parcours avant de changer le matériel', 'rouge'); return; }
  const cfg = etat.carriere;
  const disp = Object.entries(DISPOSITIONS).map(([k, d]) => `<button class="choix ${cfg.disposition === k ? 'choisi' : ''}" data-disp="${k}">${d.nom}</button>`).join('');
  const lignes = cfg.obstacles.map((ob, i) => {
    const fixe = ob.type === 'cavalettis' || ob.type === 'sol';
    const types = Object.entries(TYPES_OBST).map(([k, l]) => `<button class="choix petit ${ob.type === k ? 'choisi' : ''}" data-i="${i}" data-type="${k}">${l}</button>`).join('');
    return `<div class="reglage"><b>${i + 1}</b><div class="choix-ligne">${types}</div>
      <div class="hauteur"><button class="btn" data-i="${i}" data-dh="-1" ${fixe || ob.h <= 0.31 ? 'disabled' : ''} aria-label="Plus bas">−</button>

      <button class="btn" data-i="${i}" data-dh="1" ${fixe || ob.h >= 1.59 ? 'disabled' : ''} aria-label="Plus haut">+</button>
      ${ob.type === 'croisillon' ? `<small>${fr(hEff(ob.type, ob.h), 2)} m au centre</small>` : ''}</div></div>`;
  }).join('');
  const defile = $('#panneau').scrollTop;
  ouvrir(`<div class="pnj">Carrière · matériel</div><h2>Régler les obstacles</h2>
    <p>Choisis la disposition, puis le type et la hauteur de chaque obstacle. Cavalettis et barres au sol se passent au trot sans sauter. Les quêtes « Sans faute » et « Champion » demandent des obstacles d’au moins 0,5 m.</p>
    <h3 class="section">Disposition</h3><div class="choix-ligne">${disp}</div>
    <h3 class="section">Tout régler d’un coup</h3><div class="choix-ligne"><button class="choix" data-preset="debutant">Débutant</button><button class="choix" data-preset="normal">Normal</button><button class="choix" data-preset="difficile">Difficile</button></div>
    <h3 class="section">Obstacles</h3>${lignes}`, 'lateral', 'carriere');
  $('#panneau').scrollTop = defile;
  const appliquer = () => { reconstruireCarriere(); sauver(); tableauCarriere(); };
  const tous = s => $('#contenu').querySelectorAll(s);
  tous('[data-disp]').forEach(b => b.onclick = () => { cfg.disposition = b.dataset.disp; appliquer(); });
  tous('[data-type]').forEach(b => b.onclick = () => { cfg.obstacles[+b.dataset.i].type = b.dataset.type; appliquer(); });
  tous('[data-dh]').forEach(b => b.onclick = () => { const ob = cfg.obstacles[+b.dataset.i]; ob.h = clamp(Math.round(ob.h * 10 + +b.dataset.dh) / 10, 0.3, 1.6); appliquer(); });
  tous('[data-preset]').forEach(b => b.onclick = () => {
    const p = { debutant: [['croisillon', 0.6], ['cavalettis', 0.3], ['vertical', 0.4], ['croisillon', 0.7], ['sol', 0.3], ['vertical', 0.5]],
      normal: [['vertical', 0.6], ['oxer', 0.7], ['vertical', 0.8], ['croisillon', 1.0], ['oxer', 0.9], ['vertical', 1.0]],
      difficile: [['oxer', 1.0], ['vertical', 1.1], ['mur', 1.1], ['oxer', 1.2], ['vertical', 1.3], ['oxer', 1.3]] }[b.dataset.preset];
    cfg.obstacles = p.map(([type, h]) => ({ type, h })); appliquer();
  });
}

// ------------------------------------------------------------------ Élèves et leçons au manège couvert
const PRENOMS = [['Léa', 'f'], ['Hugo', 'm'], ['Chloé', 'f'], ['Nathan', 'm'], ['Inaya', 'f'], ['Louis', 'm'], ['Jade', 'f'], ['Tom', 'm'], ['Manon', 'f'], ['Sacha', 'm'], ['Lina', 'f'], ['Gabriel', 'm'], ['Zoé', 'f'], ['Malo', 'm']];
// Niveaux des enfants : 1 à 20, un de plus pour chaque jour où ils ont monté. hMax : la hauteur qu'ils sautent sans avoir peur.

// modèles à refaire quand le vrai cheval ou les vrais personnages sont chargés

  for (const L of [lecon, balade]) if (L) for (const R of L.groupe) { const p = R.m.g.position.clone(), r = R.m.g.rotation.y; scene.remove(R.m.g); R.m = modeleCheval(R.cheval, true, R.tenue); R.m.g.position.copy(p); R.m.g.rotation.y = r; scene.add(R.m.g); }

function remettreStagiaires() { // au chargement d'une partie
  for (const s of etat.stagiaires) if (s.depart - s.arrivee < STAGE_JOURS) s.depart = s.arrivee + STAGE_JOURS; // stages de 5 jours d'avant : deux semaines

// ---- Dressage avec Inès : un curseur passe sur une piste, on frappe quand il est dans la zone verte
const EXOS = {

  saut:      { titre: 'Cavalettis',      texte: 'Poser les foulées juste devant les barres.', vit: 1.4,  tours: 5 },

function dressage() {

function lancerExo(k) {
  const c = chevalActif(), e = EXOS[k];
  if (J.endu < 25) {
    ouvrir(`<div class="pnj">Inès · dresseuse</div><h2>${c.nom} est fatigué</h2><p>Laisse-le souffler un moment au pas, ou donne-lui une pomme (touche F), puis reviens.</p><button class="btn or" id="retour">Retour</button>`);
    $('#retour').onclick = dressage; return;
  }
  J.endu -= 25;
  const larg = clamp(0.3 - c.stats[k].niv * 0.016, 0.13, 0.3);
  const st = { pos: 0, dir: 1, tour: 0, res: [], larg, centre: 0.5, fini: false };
  const nouvelleZone = () => { st.centre = rand(larg / 2 + 0.05, 1 - larg / 2 - 0.05); };
  nouvelleZone();
  ouvrir(`<div class="pnj">Inès · ${e.titre}</div><h2>${c.nom} · ${NOM_STAT[k]}</h2>
    <p id="exo-txt">Tour 1 sur ${e.tours}</p>

    <div class="resultats" id="res"></div>
    <button class="btn or gros" id="frapper">Maintenant ! <kbd>Espace</kbd></button>`);

    $('#z').style.left = (st.centre - larg / 2) * 100 + '%'; $('#z').style.width = larg * 100 + '%';
    $('#zp').style.left = (st.centre - larg * 0.15) * 100 + '%'; $('#zp').style.width = larg * 30 + '%';
  };
  dessinerZone();
  const frapper = () => {
    if (st.fini) return;
    const ec = Math.abs(st.pos - st.centre);
    const r = ec < larg * 0.15 ? ['Parfait', 10] : ec < larg / 2 ? ['Bien', 6] : ['Raté', 1];
    st.res.push(r); son(r[1] > 5 ? 660 : 200, 0.1, 'triangle', 0.06);
    $('#res').innerHTML = st.res.map(x => `<span class="${x[0]}">${x[0]}</span>`).join('');
    st.tour++;
    if (st.tour >= e.tours) {

      etat.compteurs.dressages++; sauver();
      $('#exo-txt').innerHTML = `Séance terminée : <b>+${xp} points d’expérience</b> en ${NOM_STAT[k]}${k !== 'lien' ? ', et +3 en Lien' : ''}.`;

      $('#encore').onclick = dressage; $('#fin').onclick = fermer;

  $('#frapper').onclick = frapper;
  mini = {
    maj(dt) {
      st.pos += st.dir * dt * e.vit * (0.85 + st.tour * 0.06);
      if (st.pos > 1) { st.pos = 1; st.dir = -1; } if (st.pos < 0) { st.pos = 0; st.dir = 1; }
      const cur = $('#cur'); if (cur) cur.style.left = st.pos * 100 + '%';
    },

  };
}

// ---- Apprivoiser un cheval sauvage : garder le curseur dans la zone calme jusqu'à ce que la confiance soit pleine
function apprivoiser(s) {
  const robe = ROBES[s.robe];
  ouvrir(`<div class="pnj">Cheval sauvage · robe ${robe.nom.toLowerCase()}</div><h2>Gagne sa confiance</h2>
    <p>Il est nerveux. Garde le curseur dans la zone verte avec <kbd>Q</kbd> <kbd>D</kbd> (ou les flèches) jusqu’à remplir la confiance. Si le temps s’écoule, il s’enfuit.</p>
    <div class="piste"><div class="zone" style="left:35%;width:30%"></div><div class="curseur" id="cur"></div></div>
    <div class="jauge-lbl"><span>Confiance</span><span id="tps"></span></div>
    <div class="confiance"><i id="conf"></i></div>
    <div class="tenir"><button class="btn" data-tenir="KeyA">←</button><button class="btn" data-tenir="KeyD">→</button></div>`);
  $('#contenu').querySelectorAll('[data-tenir]').forEach(b => {
    const k = b.dataset.tenir;
    b.onpointerdown = e => { e.preventDefault(); touches[k] = true; };
    b.onpointerup = b.onpointerleave = b.onpointercancel = () => { touches[k] = false; };
  });
  const st = { pos: 0.5, v: 0, conf: 0, temps: 25 };
  const lienBonus = chevalActif().stats.lien.niv;
  mini = {
    maj(dt) {
      const f = (touches.KeyD || touches.ArrowRight ? 1 : 0) - (touches.KeyA || touches.ArrowLeft ? 1 : 0);
      st.v += (Math.random() - 0.5) * dt * 9 * (1.2 - st.conf / 120) + f * dt * 2.4;
      st.v *= Math.pow(0.35, dt);
      st.pos += st.v * dt;
      if (st.pos < 0 || st.pos > 1) { st.pos = clamp(st.pos, 0, 1); st.v = 0; }
      const calme = Math.abs(st.pos - 0.5) < 0.15;
      st.conf = clamp(st.conf + (calme ? 13 + lienBonus : -9) * dt, 0, 100);
      st.temps -= dt;
      const cur = $('#cur'); if (!cur) return;
      cur.style.left = st.pos * 100 + '%';
      $('#conf').style.width = st.conf + '%';
      $('#tps').textContent = `${Math.max(0, Math.ceil(st.temps))} s`;
      if (st.conf >= 100) reussite();
      else if (st.temps <= 0) echec();
    },
    touche() {},
  };
  const reussite = () => {
    mini = null;
    const base = { vitesse: 1, saut: 1, endurance: 1, lien: 1 };
    for (let i = 0; i < 5; i++) { const k = pick(['vitesse', 'saut', 'endurance']); base[k] = Math.min(4, base[k] + 1); }
    const c = nouveauCheval(nomLibre(), 'Cheval de la plaine', s.robe, base, s.taille);
    etat.chevaux.push(c); etat.compteurs.apprivoises++;
    scene.remove(s.m.g); sauvages.splice(sauvages.indexOf(s), 1); attenteSauvage = 45;
    majResidents(); sauver(); sonPiece();
    ouvrir(`<div class="pnj">Nouveau cheval</div><h2>Tu as apprivoisé ${c.nom} !</h2>
      <p>${c.nom} t’attend maintenant au paddock du ranch. Un cheval de la plaine a peu de lien au départ : travaille-le au manège avec Inès et donne-lui des friandises.</p>
      ${blocStats(c.stats)}<div class="boutons" style="margin-top:12px"><button class="btn or" id="monte">Le monter maintenant</button><button class="btn" id="ok">Plus tard</button></div>`);
    $('#monte').onclick = () => { monter(c.id); fermer(); };
    $('#ok').onclick = fermer;
  };
  const echec = () => {
    mini = null;
    const p = pointPlaine(); s.x = p.x; s.z = p.z; s.cible = null;
    ouvrir(`<div class="pnj">Cheval sauvage</div><h2>Il s’est enfui…</h2><p>Il a eu peur et galope plus loin dans la plaine. Approche-toi doucement et retente ta chance. Un cheval monté qui a beaucoup de lien rassure les chevaux sauvages.</p><button class="btn or" id="ok">D’accord</button>`);
    $('#ok').onclick = fermer;
  };
}

// ---- Parcours d'obstacles en carrière
const parcours = { actif: false, prochain: 1, t: 0, fautes: 0, affiche: 0, terrain: 'carriere' };
function remettreBarres() { for (const o of obstacles) if (o.barre) { o.tombe = 0; o.barre.position.set(0, o.barreY, 0); o.barre.rotation.set(0, 0, 0); } }
function basculerParcours(terrain = 'carriere') {
  if (parcours.actif) { parcours.actif = false; toast('Parcours abandonné'); if (concours?.attenteJoueur) joueurAFini(0, 0, true); return; }
  if (concours && !concours.attenteJoueur) { toast('Un concours est en cours : attends ton tour', 'rouge'); return; }
  if (concours?.attenteJoueur && concours.terrain !== terrain) { toast('Ton tour se court sur l’autre terrain', 'rouge'); return; }
  if (etat.aPied) { toast('Monte à cheval pour prendre le départ (touche M)', 'rouge'); return; }
  remettreBarres();
  Object.assign(parcours, { actif: true, prochain: 1, t: 0, fautes: 0, affiche: 0, terrain });
  toast('Parcours lancé ! Saute les obstacles de 1 à 6 dans l’ordre', 'or');
  son(440, 0.15, 'square', 0.04); setTimeout(() => son(880, 0.25, 'square', 0.04), 180);
}
function finirParcours() {
  parcours.actif = false;
  if (concours?.attenteJoueur) { // un tour de concours : il va au classement, sans les gains ordinaires
    const total = parcours.t + parcours.fautes * 4; parcours.affiche = 6;
    $('#chrono').innerHTML = `${fr(total)} s<small>${parcours.fautes ? `${parcours.fautes} faute${parcours.fautes > 1 ? 's' : ''}` : 'sans faute'} · au classement du concours</small>`;
    sonPiece(); joueurAFini(total, parcours.fautes); return;
  }
  const total = parcours.t + parcours.fautes * 4, sf = parcours.fautes === 0;
  // le gain suit la difficulté réglée ; un parcours trop bas ne compte pas pour les quêtes ni le record
  const hauteurs = etat.carriere.obstacles.map(o => hEff(o.type, o.h)), exigeant = hauteurs.every(h => h >= 0.5);
  const gain = Math.round(10 + hauteurs.reduce((a, b) => a + b, 0) * 6) + (sf ? 30 : 0);
  etat.pieces += gain; etat.compteurs.parcours++;
  if (sf && exigeant) etat.compteurs.sansfaute++;
  if (sf && exigeant && total < 45) etat.compteurs.champion++;
  if (!exigeant) setTimeout(() => toast('Parcours facile : il ne compte ni pour les quêtes « Sans faute », ni pour le record'), 1200);
  const record = exigeant && (!etat.record || total < etat.record);
  if (record) etat.record = total;
  parcours.affiche = 6;
  $('#chrono').innerHTML = `${fr(total)} s<small>${sf ? 'sans faute' : parcours.fautes + ' faute' + (parcours.fautes > 1 ? 's' : '') + ' (+4 s chacune)'}${record ? ' · nouveau record' : ''} · +${gain} pièces</small>`;
  toast(sf ? 'Parcours sans faute !' : 'Parcours terminé', 'or'); sonPiece(); sauver();
}

// ------------------------------------------------------------------ Interactions (touche E)
const interactions = [
  { x: P_MARGAUX.x, z: P_MARGAUX.z, r: 5, texte: () => queteFinie() ? 'Réclamer ta récompense à Margaux' : 'Parler à Margaux', action: dialogueMargaux },
  { x: P_BASILE.x, z: P_BASILE.z, r: 5, texte: () => 'Voir les chevaux de Basile', action: boutique },
  { x: P_INES.x, z: P_INES.z, r: 6, texte: () => 'Dresser ton cheval avec Inès', action: dressage },
  { x: ECURIE.x, z: ECURIE.z - 2.3, r: 2.6, texte: () => 'Choisir la selle et le tapis', action: () => atelier('selle') },
  { x: PORTE_GITE.x, z: PORTE_GITE.z, r: 3.5, texte: () => 'Entrer au gîte des cavaliers', action: () => panneauGite() },
  { x: MAISON.x + 3.5, z: MAISON.z + 1.3, r: 1.7, texte: () => etat.heure >= 18 || etat.heure < 6 ? 'Dormir dans ton lit' : 'Ton lit (on dort après 18 h)', action: () => dormir() },
  { x: MAISON.x - 2, z: MAISON.z - 1.4, r: 1.9, texte: () => 'S’asseoir à la table : tes réserves et tes comptes', action: () => panneauMaison() },
  { x: COMPTOIR.x, z: COMPTOIR.z - 1.2, r: 3.5, texte: () => 'Acheter et vendre au comptoir', action: () => comptoir() },
  { x: TABLEAU.x, z: TABLEAU.z, r: 4, texte: () => 'Régler le matériel de la carrière', action: tableauCarriere },
  { x: DEPART.x, z: DEPART.z, r: 4.5, texte: () => parcours.actif ? 'Abandonner le parcours' : concours?.attenteJoueur ? 'Prendre le départ du concours' : 'Lancer le parcours', action: () => basculerParcours('carriere') },
  { x: DEPART_R.x, z: DEPART_R.z, r: 4.5, si: () => concours?.terrain === 'regional' || (parcours.actif && parcours.terrain === 'regional'), texte: () => parcours.actif ? 'Abandonner le parcours' : 'Prendre le départ du concours', action: () => basculerParcours('regional') },
  { x: JUGE.x, z: JUGE.z, r: 4, texte: () => 'Organiser un concours ouvert', action: () => organiserOuvert() },
  { x: JUGE_R.x, z: JUGE_R.z, r: 4.5, texte: () => 'S’inscrire au concours régional', action: () => inscriptionRegional() },
];
function interactionProche() {
  let best = null, bd = Infinity;
  if (etat.conduite) return { texte: () => 'Sortir de la voiture', action: sortirVoiture };
  for (const it of interactions) { if (it.si && !it.si()) continue; const d = Math.hypot(J.x - it.x, J.z - it.z); if (d < it.r && d < bd) { bd = d; best = it; } }
  for (const [k, m] of Object.entries(MARCHANDS)) { const d = Math.hypot(J.x - m.x, J.z - m.z); if (d < 4.5 && d < bd) { bd = d; best = { texte: () => `${m.nom} · ${m.metier}`, action: () => k === 'lucien' ? sellier() : etalMarche(k) }; } }
  if (VOIT && etat.aPied) {
    const dv = Math.hypot(J.x - VOIT.x, J.z - VOIT.z);
    if (dv < 3.4 && dv < bd && !mene) { bd = dv; best = { texte: () => 'Conduire la voiture', action: entrerVoiture }; }
    const ar = arriereVan(), da = Math.hypot(J.x - ar.x, J.z - ar.z), dans = chevauxDansVan();
    if (da < 3.2 && da < bd) {
      if (mene && dans.length < 2) { bd = da; best = { texte: () => `Faire monter ${mene.cheval.nom} dans le van`, action: chargerVan }; }
      else if (!mene && dans.length) { bd = da; best = { texte: () => `Faire descendre ${dans[0].nom} du van`, action: () => dechargerVan(dans[0]) }; }
    }
  }
  for (const s of sauvages) {
    const d = Math.hypot(J.x - s.x, J.z - s.z);
    if (d < 5 && d < bd) { bd = d; best = { texte: () => 'Apprivoiser ce cheval sauvage', action: () => apprivoiser(s) }; }
  }
  for (const r of residents) {
    if (r.box) {
      const pp = BOX_PORTE(r.cheval.box), d = Math.hypot(J.x - pp.x, J.z - pp.z);
      if (d < 2.4 && d < bd) { bd = d; best = { texte: () => `Soigner ${r.cheval.nom}`, action: () => soigner(r.cheval) }; }
      continue;
    }
    const d = Math.hypot(J.x - r.x, J.z - r.z);
    if (d < 3.5 && d < bd) {
      bd = d;
      best = !etat.aPied ? { texte: () => `Monter ${r.cheval.nom}`, action: () => monter(r.cheval.id) }
        : r === mene ? { texte: () => `S’occuper de ${r.cheval.nom} (en main)`, action: () => aupresDuCheval(r) }
        : { texte: () => `S’occuper de ${r.cheval.nom}`, action: () => aupresDuCheval(r) };
    }
  }
  if (mene && mene.cheval.box != null) { // ramener au box le cheval qu'on mène

  }
  for (const po of portes) {
    const d = Math.hypot(J.x - po.x, J.z - po.z);
    if (d < 3 && d < bd) { bd = d; best = { texte: () => `${po.pre.ouverte ? 'Fermer' : 'Ouvrir'} la barrière du ${po.pre.nom}`, action: () => basculerPorte(po) }; }
  }
  for (const e of eleves) {
    if (e.etat !== 'attend') continue;
    const d = Math.hypot(J.x - e.x, J.z - e.z);
    if (d < 3.5 && d < bd) { bd = d; best = { texte: () => `Proposer un cours ou une balade à ${e.nom}`, action: () => proposerLecon(e) }; }
  }
  { const ch = champSous(J.x, J.z, 1.5); if (ch && bd > 2.5) { bd = 2.5; const g = croissance(ch); best = { texte: () => !ch.culture ? 'Semer ce champ' : g >= 1 ? `Récolter le champ ${CULTURES[ch.culture].de}` : `Champ ${CULTURES[ch.culture].de} : ${Math.round(g * 100)} %`, action: () => panneauChamp(ch) }; } }
  if (!parcours.actif) for (const o of obstacles) {
    if (!o.num || o.terrain) continue;
    const d = Math.hypot(J.x - o.x, J.z - o.z);
    if (d < 3 && d < bd) { bd = d; best = { texte: () => `Régler l’obstacle ${o.num}`, action: tableauCarriere }; }

}
