<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mise à jour du Ranch</title>
<style>body{font-family:system-ui,sans-serif;background:#2f783c;color:#fff;text-align:center;padding:40px 20px;font-size:18px}</style>
<h1>Ranch des Quatre Vents</h1><p id="m">Mise à jour en cours…</p>
<script>
(async () => {
  const m = document.getElementById('m');
  try {
    for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
    for (const k of await caches.keys()) await caches.delete(k);
    m.textContent = 'Ancienne version effacée (ta partie est gardée). Ouverture du jeu…';
    const q = new URLSearchParams(location.search); q.set('neuf', Date.now()); // garde « partie=… »
    setTimeout(() => location.replace('./index.html?' + q), 1200);
  } catch (e) { m.textContent = 'Erreur : ' + e; }
})();
</script>
